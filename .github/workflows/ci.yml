name: TrámiteYa CI

on:
  push:
    branches: ["phase-1-setup", "main"]
  pull_request:
    branches: ["phase-1-setup", "main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Production build
        run: npm run build
